<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Looseleaf Math — NC.2.OA.4 Live Interactive Wireframe</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e8dcc4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #notice {
        background: #78350f;
        color: #fffbeb;
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      #notice a {
        color: #fde047;
        text-decoration: underline;
        font-weight: 700;
      }
      #notice button {
        background: #fde047;
        color: #78350f;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        font-weight: 700;
        cursor: pointer;
      }
      iframe {
        width: 100%;
        height: calc(100% - 42px);
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="notice">
      <span
        >🎨 <strong>Looseleaf UI Interactive Prototype</strong> (React 19 + Ink Engine) running on
        <a href="http://localhost:5173" target="_blank">http://localhost:5173</a></span
      >
      <button
        onclick="document.getElementById('frame').src = 'http://localhost:5173/?t=' + Date.now()"
      >
        🔄 Refresh Frame
      </button>
    </div>
    <iframe id="frame" src="http://localhost:5173/"></iframe>
  </body>
</html>
