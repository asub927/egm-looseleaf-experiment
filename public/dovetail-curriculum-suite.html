<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Dovetail Joinery · Vibrant Dyed Wood Showcase (NC Grade 2)</title>
    <style>
      :root {
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-snap: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);

        /* Grimm's Vibrant Stained-Wood Palette */
        --stain-coral: linear-gradient(180deg, #ff6b81 0%, #ee5253 100%);
        --stain-coral-glow: rgba(238, 82, 83, 0.45);
        --stain-mint: linear-gradient(180deg, #2ed573 0%, #10ac84 100%);
        --stain-mint-glow: rgba(16, 172, 132, 0.45);
        --stain-honey: linear-gradient(180deg, #ffa502 0%, #ff7f50 100%);
        --stain-honey-glow: rgba(255, 127, 80, 0.45);
        --stain-sky: linear-gradient(180deg, #70a1ff 0%, #1e90ff 100%);
        --stain-sky-glow: rgba(30, 144, 255, 0.45);
        --stain-lavender: linear-gradient(180deg, #a55eea 0%, #8854d0 100%);
        --stain-lavender-glow: rgba(136, 84, 208, 0.45);
        --stain-lemon: linear-gradient(180deg, #fed330 0%, #f7b731 100%);

        --birch-bg: radial-gradient(circle at 50% 30%, #fdfbf7 0%, #ece5d8 100%);
        --bench-surface: #ffffff;
        --recess-tray: #e4dcce;
        --recess-shadow: inset 0 4px 12px rgba(60, 48, 36, 0.22);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Rounded", ui-rounded, "Segoe UI", Roboto,
          sans-serif;
        background: var(--birch-bg);
        color: #2c2724;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* =========================================
         TOP CURRICULUM SELECTOR (STUDIO NAV)
         ========================================= */
      header {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1.5px solid rgba(0, 0, 0, 0.08);
        border-radius: 999px;
        padding: 6px 10px;
        box-shadow: 0 16px 40px rgba(50, 40, 30, 0.1);
      }

      .curriculum-tab {
        padding: 8px 18px;
        border-radius: 999px;
        border: none;
        background: transparent;
        color: #635b54;
        font-size: 13.5px;
        font-weight: 800;
        letter-spacing: -0.01em;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s var(--ease-smooth);
      }

      .curriculum-tab:hover {
        color: #111;
        transform: translateY(-1px);
      }

      .curriculum-tab.active {
        background: #201e2b;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      }

      .curriculum-tab .badge {
        font-size: 10px;
        font-weight: 900;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
      }

      .curriculum-tab.active .badge {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }

      /* =========================================
         WOODEN WORKBENCH CONTAINER
         ========================================= */
      .workbench-card {
        width: 840px;
        height: 550px;
        background: var(--bench-surface);
        border-radius: 44px;
        border: 2px solid #ede5d8;
        box-shadow:
          0 32px 90px rgba(70, 55, 40, 0.14),
          0 4px 16px rgba(70, 55, 40, 0.04);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 38px 46px;
        position: relative;
        overflow: hidden;
      }

      .workbench-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .workbench-title {
        font-size: 14.5px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8c8278;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .reset-btn {
        padding: 6px 16px;
        border-radius: 999px;
        background: #f7f3ec;
        border: 1.5px solid #e4dcce;
        color: #5c534b;
        font-size: 12.5px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .reset-btn:hover {
        background: #201e2b;
        color: #fff;
        border-color: #201e2b;
        transform: translateY(-1px);
      }

      /* Viewport Stage Host */
      .station-host {
        width: 100%;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .station-view {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .station-view.active {
        display: flex;
        opacity: 1;
      }

      /* Engraved Equation Badge */
      .engraved-brass-badge {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #7d7266;
        transition: all 0.3s ease;
      }

      .engraved-brass-badge.solved {
        color: #065f46;
        transform: scale(1.06);
      }

      /* =======================================================
         STATION 1: 10-FRAME COMPLEMENTS (NC.2.OA.2)
         Coral Red (6) + Mint Emerald (4) = 10
         ======================================================= */
      .tray-inset-10 {
        width: 640px;
        height: 96px;
        background: var(--recess-tray);
        border-radius: 28px;
        box-shadow: var(--recess-shadow);
        display: flex;
        align-items: center;
        padding: 10px;
        gap: 8px;
        position: relative;
      }

      .wood-pocket {
        flex: 1;
        height: 100%;
        border-radius: 18px;
        background: #d6ccbe;
        box-shadow: inset 0 2px 6px rgba(60, 48, 36, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* Known 6 Pegs: Dyed Strawberry Coral */
      .wood-pocket.known-coral {
        background: var(--stain-coral);
        box-shadow:
          0 4px 10px var(--stain-coral-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.6);
      }

      .wood-pocket.known-coral::after {
        content: "";
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #b33939;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
      }

      .tray-snap-zone-10 {
        position: absolute;
        right: 10px;
        top: 10px;
        bottom: 10px;
        width: 242px; /* 4 slots */
        border-radius: 20px;
        border: 2.5px dashed #10ac84;
        background: rgba(46, 213, 115, 0.12);
        transition: all 0.2s ease;
      }

      .tray-snap-zone-10.hover {
        background: rgba(46, 213, 115, 0.28);
        border-color: #059669;
        box-shadow: 0 0 20px var(--stain-mint-glow);
      }

      /* Draggable 4-Peg Block: Dyed Sage Emerald Mint */
      .drag-block-10 {
        width: 242px;
        height: 76px;
        border-radius: 20px;
        background: var(--stain-mint);
        box-shadow:
          0 10px 24px var(--stain-mint-glow),
          inset 0 2px 2px rgba(255, 255, 255, 0.65);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 16px;
        cursor: grab;
        position: absolute;
        bottom: 24px;
        touch-action: none;
        transition:
          transform 0.15s var(--ease-spring),
          box-shadow 0.15s ease;
      }

      .drag-block-10.elevated {
        transform: scale(1.08) translateY(-16px);
        box-shadow:
          0 32px 60px rgba(16, 172, 132, 0.5),
          inset 0 2px 2px rgba(255, 255, 255, 0.8);
      }

      .drag-block-10.locked {
        position: absolute;
        right: 10px;
        top: 10px;
        bottom: 10px;
        box-shadow:
          0 4px 10px var(--stain-mint-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.5);
        cursor: default;
        animation: snapRecoil 0.22s var(--ease-snap);
      }

      @keyframes snapRecoil {
        0% {
          transform: scale(0.95);
        }
        50% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }

      .peg-dot-mint {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #065f46;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      /* =======================================================
         STATION 2: INTERLOCKING ARRAYS (NC.2.OA.4)
         Row 1: Honey Gold
         Row 2: Sky Blue
         Row 3: Strawberry Coral
         ======================================================= */
      .array-tray-inset {
        width: 420px;
        height: 250px;
        background: var(--recess-tray);
        border-radius: 30px;
        box-shadow: var(--recess-shadow);
        display: flex;
        flex-direction: column;
        padding: 14px;
        gap: 12px;
        position: relative;
      }

      .array-row-slat {
        width: 100%;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 20px;
      }

      .array-row-slat.row-honey {
        background: var(--stain-honey);
        box-shadow:
          0 4px 12px var(--stain-honey-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.6);
      }
      .array-row-slat.row-honey .array-peg {
        background: #c0392b;
      }

      .array-row-slat.row-sky {
        background: var(--stain-sky);
        box-shadow:
          0 4px 12px var(--stain-sky-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.6);
      }
      .array-row-slat.row-sky .array-peg {
        background: #0c2461;
      }

      .array-peg {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      .array-row-target-zone {
        width: 100%;
        height: 64px;
        border-radius: 18px;
        border: 2.5px dashed #ee5253;
        background: rgba(238, 82, 83, 0.1);
        transition: all 0.2s ease;
      }

      .array-row-target-zone.hover {
        background: rgba(238, 82, 83, 0.25);
        box-shadow: 0 0 24px var(--stain-coral-glow);
      }

      /* Draggable Row 3: Strawberry Coral */
      .array-drag-slat {
        width: 392px;
        height: 64px;
        border-radius: 18px;
        background: var(--stain-coral);
        box-shadow:
          0 10px 24px var(--stain-coral-glow),
          inset 0 2px 2px rgba(255, 255, 255, 0.6);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 20px;
        position: absolute;
        bottom: 16px;
        cursor: grab;
        touch-action: none;
        transition: transform 0.15s var(--ease-spring);
      }

      .array-drag-slat .array-peg {
        background: #b33939;
      }

      .array-drag-slat.elevated {
        transform: scale(1.08) translateY(-16px);
        box-shadow: 0 32px 60px var(--stain-coral-glow);
      }

      .array-drag-slat.locked {
        position: absolute;
        bottom: 14px;
        left: 14px;
        right: 14px;
        width: auto;
        box-shadow: 0 4px 10px var(--stain-coral-glow);
        cursor: default;
        animation: snapRecoil 0.22s var(--ease-snap);
      }

      /* =======================================================
         STATION 3: ODD & EVEN PARITY (NC.2.OA.3)
         Left Column: Deep Royal Lavender (#8854d0)
         Right Column: Sunshine Honey (#ffa502)
         Snapping Peg: Vibrant Sky Blue (#1e90ff)
         ======================================================= */
      .parity-board-inset {
        width: 480px;
        height: 270px;
        background: var(--recess-tray);
        border-radius: 30px;
        box-shadow: var(--recess-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
        padding: 24px;
        position: relative;
      }

      .parity-column-track {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .parity-peg-socket {
        width: 60px;
        height: 48px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .parity-peg-socket.team-lavender {
        background: var(--stain-lavender);
        box-shadow:
          0 4px 10px var(--stain-lavender-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.55);
      }
      .parity-peg-socket.team-lavender::after {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #4a148c;
      }

      .parity-peg-socket.team-honey {
        background: var(--stain-honey);
        box-shadow:
          0 4px 10px var(--stain-honey-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.55);
      }
      .parity-peg-socket.team-honey::after {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #b71540;
      }

      .parity-target-socket {
        width: 60px;
        height: 48px;
        border-radius: 16px;
        border: 2.5px dashed #1e90ff;
        background: rgba(30, 144, 255, 0.12);
        transition: all 0.2s ease;
      }

      .parity-target-socket.hover {
        background: rgba(30, 144, 255, 0.3);
        box-shadow: 0 0 20px var(--stain-sky-glow);
      }

      .parity-drag-peg {
        width: 60px;
        height: 48px;
        border-radius: 16px;
        background: var(--stain-sky);
        box-shadow:
          0 8px 20px var(--stain-sky-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        bottom: 20px;
        cursor: grab;
        touch-action: none;
        transition: transform 0.15s var(--ease-spring);
      }

      .parity-drag-peg::after {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #0c2461;
      }

      .parity-drag-peg.elevated {
        transform: scale(1.18) translateY(-16px);
        box-shadow: 0 30px 50px var(--stain-sky-glow);
      }

      .parity-drag-peg.locked {
        position: static;
        box-shadow: 0 4px 10px var(--stain-sky-glow);
        cursor: default;
        animation: snapRecoil 0.22s var(--ease-snap);
      }

      /* =======================================================
         STATION 4: GEOMETRY EQUAL PARTITIONING (NC.2.G.3)
         Wedge 1: Strawberry Coral (#ee5253)
         Wedge 2: Sky Blue (#1e90ff)
         Wedge 3: Mint Green (#10ac84)
         ======================================================= */
      .geometry-pan-inset {
        width: 270px;
        height: 270px;
        border-radius: 50%;
        background: var(--recess-tray);
        box-shadow: var(--recess-shadow);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wedge-svg {
        width: 270px;
        height: 270px;
      }

      .wedge-snap-zone {
        fill: rgba(46, 213, 115, 0.12);
        stroke: #10ac84;
        stroke-width: 2.5;
        stroke-dasharray: 6 5;
        transition: fill 0.2s ease;
      }

      .wedge-snap-zone.hover {
        fill: rgba(46, 213, 115, 0.35);
        filter: drop-shadow(0 0 16px var(--stain-mint-glow));
      }

      .wedge-drag-container {
        position: absolute;
        bottom: 10px;
        cursor: grab;
        touch-action: none;
        transition: transform 0.15s var(--ease-spring);
      }

      .wedge-drag-container.elevated {
        transform: scale(1.15) translateY(-16px);
        filter: drop-shadow(0 24px 40px var(--stain-mint-glow));
      }

      .wedge-drag-container.locked {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        cursor: default;
        animation: snapRecoil 0.22s var(--ease-snap);
      }
    </style>
  </head>
  <body>
    <!-- Top Minimalist Curriculum Nav Bar -->
    <header>
      <button class="curriculum-tab active" id="tab-1" onclick="switchStation(1)">
        <span>1. Making Ten</span>
        <span class="badge">NC.2.OA.2</span>
      </button>

      <button class="curriculum-tab" id="tab-2" onclick="switchStation(2)">
        <span>2. Arrays</span>
        <span class="badge">NC.2.OA.4</span>
      </button>

      <button class="curriculum-tab" id="tab-3" onclick="switchStation(3)">
        <span>3. Odd & Even</span>
        <span class="badge">NC.2.OA.3</span>
      </button>

      <button class="curriculum-tab" id="tab-4" onclick="switchStation(4)">
        <span>4. Geometry Shares</span>
        <span class="badge">NC.2.G.3</span>
      </button>
    </header>

    <!-- Main Workbench Container -->
    <div class="workbench-card">
      <div class="workbench-header">
        <span class="workbench-title" id="workbenchTitle">
          <span style="font-size: 18px">🍓</span>
          <span>Station 1: Ten-Frame Inset (6 + 4 = 10)</span>
        </span>
        <button class="reset-btn" onclick="resetCurrentStation()">↺ Reset Piece</button>
      </div>

      <div class="station-host">
        <!-- ==============================================
             STATION 1: MAKING TEN (NC.2.OA.2)
             ============================================== -->
        <div class="station-view active" id="station-1">
          <div class="tray-inset-10" id="tray10">
            <!-- 6 Known Strawberry Coral Pegs -->
            <div class="wood-pocket known-coral"></div>
            <div class="wood-pocket known-coral"></div>
            <div class="wood-pocket known-coral"></div>
            <div class="wood-pocket known-coral"></div>
            <div class="wood-pocket known-coral"></div>
            <div class="wood-pocket known-coral"></div>
            <!-- 4 Empty Recessed Pockets -->
            <div class="wood-pocket"></div>
            <div class="wood-pocket"></div>
            <div class="wood-pocket"></div>
            <div class="wood-pocket"></div>
            <!-- Snap Target Zone -->
            <div class="tray-snap-zone-10" id="snapZone10"></div>
          </div>

          <!-- Draggable 4-Peg Block: Vibrant Sage Mint -->
          <div class="drag-block-10" id="block10">
            <div class="peg-dot-mint"></div>
            <div class="peg-dot-mint"></div>
            <div class="peg-dot-mint"></div>
            <div class="peg-dot-mint"></div>
          </div>
        </div>

        <!-- ==============================================
             STATION 2: ARRAYS (NC.2.OA.4)
             ============================================== -->
        <div class="station-view" id="station-2">
          <div class="array-tray-inset" id="arrayTray">
            <!-- Row 1: Honey Gold -->
            <div class="array-row-slat row-honey">
              <div class="array-peg"></div>
              <div class="array-peg"></div>
              <div class="array-peg"></div>
              <div class="array-peg"></div>
            </div>
            <!-- Row 2: Sky Blue -->
            <div class="array-row-slat row-sky">
              <div class="array-peg"></div>
              <div class="array-peg"></div>
              <div class="array-peg"></div>
              <div class="array-peg"></div>
            </div>
            <!-- Row 3 Target Drop Zone: Coral -->
            <div class="array-row-target-zone" id="arrayDropZone"></div>
          </div>

          <!-- Draggable Row 3 Slat: Strawberry Coral -->
          <div class="array-drag-slat" id="arrayDragSlat">
            <div class="array-peg"></div>
            <div class="array-peg"></div>
            <div class="array-peg"></div>
            <div class="array-peg"></div>
          </div>
        </div>

        <!-- ==============================================
             STATION 3: ODD & EVEN PARITY (NC.2.OA.3)
             ============================================== -->
        <div class="station-view" id="station-3">
          <div class="parity-board-inset" id="parityBoard">
            <!-- Left Column: 4 Lavender Pegs -->
            <div class="parity-column-track">
              <div class="parity-peg-socket team-lavender"></div>
              <div class="parity-peg-socket team-lavender"></div>
              <div class="parity-peg-socket team-lavender"></div>
              <div class="parity-peg-socket team-lavender"></div>
            </div>

            <!-- Right Column: 3 Honey Pegs + 1 Sky Blue Snap Socket -->
            <div class="parity-column-track">
              <div class="parity-peg-socket team-honey"></div>
              <div class="parity-peg-socket team-honey"></div>
              <div class="parity-peg-socket team-honey"></div>
              <div class="parity-target-socket" id="parityDropSocket"></div>
            </div>
          </div>

          <!-- Draggable Sky Blue Peg -->
          <div class="parity-drag-peg" id="parityPeg"></div>
        </div>

        <!-- ==============================================
             STATION 4: GEOMETRY EQUAL SHARES (NC.2.G.3)
             ============================================== -->
        <div class="station-view" id="station-4">
          <div class="geometry-pan-inset" id="geoPan">
            <svg class="wedge-svg" viewBox="0 0 270 270">
              <defs>
                <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ff6b81" />
                  <stop offset="100%" stop-color="#ee5253" />
                </linearGradient>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#70a1ff" />
                  <stop offset="100%" stop-color="#1e90ff" />
                </linearGradient>
                <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#2ed573" />
                  <stop offset="100%" stop-color="#10ac84" />
                </linearGradient>
              </defs>

              <!-- Wedge 1: Strawberry Coral (0 to 120 deg) -->
              <path
                d="M 135 135 L 135 15 A 120 120 0 0 1 238.92 195 Z"
                fill="url(#coralGrad)"
                stroke="#c0392b"
                stroke-width="2"
              />
              <!-- Wedge 2: Sky Blue (120 to 240 deg) -->
              <path
                d="M 135 135 L 238.92 195 A 120 120 0 0 1 31.08 195 Z"
                fill="url(#skyGrad)"
                stroke="#0c2461"
                stroke-width="2"
              />
              <!-- Target Snap Zone (240 to 360 deg) -->
              <path
                class="wedge-snap-zone"
                id="geoSnapZone"
                d="M 135 135 L 31.08 195 A 120 120 0 0 1 135 15 Z"
              />
            </svg>
          </div>

          <!-- Draggable 3rd Wedge: Mint Green -->
          <div class="wedge-drag-container" id="geoWedge">
            <svg width="140" height="140" viewBox="0 0 140 140">
              <path
                d="M 125 125 L 25 180 A 120 120 0 0 1 125 10 Z"
                fill="url(#mintGrad)"
                stroke="#065f46"
                stroke-width="2.5"
              />
            </svg>
          </div>
        </div>
      </div>

      <!-- Engraved Dynamic Equation Result -->
      <div class="engraved-brass-badge" id="engravedBadge">
        6 (Coral) + 4 (Mint) = 10 · Flush Dovetail Joint
      </div>
    </div>

    <script>
      // ==============================================================
      // PROCEDURAL ACOUSTIC WOOD BLOCK SYNTHESIZER (BINAURAL THOCK)
      // ==============================================================
      let audioCtx = null
      function getAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        if (audioCtx.state === "suspended") audioCtx.resume()
        return audioCtx
      }

      function playWoodThock(pitchMultiplier = 1.0) {
        try {
          const ctx = getAudio()
          const osc = ctx.createOscillator()
          const filter = ctx.createBiquadFilter()
          const gain = ctx.createGain()

          osc.type = "sine"
          const baseFreq = 440 * pitchMultiplier
          osc.frequency.setValueAtTime(baseFreq, ctx.currentTime)
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.35, ctx.currentTime + 0.07)

          filter.type = "bandpass"
          filter.frequency.setValueAtTime(560 * pitchMultiplier, ctx.currentTime)
          filter.Q.setValueAtTime(7.0, ctx.currentTime)

          gain.gain.setValueAtTime(0.75, ctx.currentTime)
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11)

          osc.connect(filter)
          filter.connect(gain)
          gain.connect(ctx.destination)

          osc.start()
          osc.stop(ctx.currentTime + 0.12)
        } catch (e) {}
      }

      function playSequentialThocks() {
        ;[1.0, 1.18, 1.35].forEach((pitch, i) => {
          setTimeout(() => playWoodThock(pitch), i * 65)
        })
      }

      // ==============================================================
      // CURRICULUM STATION SWITCHER
      // ==============================================================
      const TITLES = {
        1: '<span style="font-size: 18px;">🍓</span><span>Station 1: Ten-Frame Inset (6 Coral + 4 Mint = 10)</span>',
        2: '<span style="font-size: 18px;">🍯</span><span>Station 2: Interlocking Arrays (3 Rows × 4 Cols = 12)</span>',
        3: '<span style="font-size: 18px;">🫐</span><span>Station 3: Odd & Even Parity (8 = 4 Lavender + 4 Honey)</span>',
        4: '<span style="font-size: 18px;">🥧</span><span>Station 4: Geometry Fruit Tart (3 Equal Thirds)</span>',
      }

      const EQUATIONS = {
        1: {
          normal: "6 (Coral) + 4 (Mint) = 10 · Flush Dovetail Joint",
          solved: "10 − 6 = 4 · Inset Completed ✓",
        },
        2: {
          normal: "Honey (4) + Blue (4) + Coral (4) = 12",
          solved: "3 Rows × 4 Cols = 12 · Solid Array Locked ✓",
        },
        3: {
          normal: "4 Lavender + 4 Honey = 8 Symmetrical Pairs",
          solved: "8 is EVEN · Perfect Partner Teams ✓",
        },
        4: {
          normal: "Coral (1/3) + Blue (1/3) + Mint (1/3) = 1 Whole",
          solved: "3 Thirds = 1 Whole Fruit Tart ✓",
        },
      }

      let currentStation = 1

      function switchStation(id) {
        currentStation = id
        document.querySelectorAll(".station-view").forEach((v) => v.classList.remove("active"))
        document.querySelectorAll(".curriculum-tab").forEach((t) => t.classList.remove("active"))

        document.getElementById(`station-${id}`).classList.add("active")
        document.getElementById(`tab-${id}`).classList.add("active")
        document.getElementById("workbenchTitle").innerHTML = TITLES[id]
        document.getElementById("engravedBadge").textContent = EQUATIONS[id].normal
        document.getElementById("engravedBadge").classList.remove("solved")

        playWoodThock(0.95)
      }

      function resetCurrentStation() {
        if (currentStation === 1) resetStation1()
        else if (currentStation === 2) resetStation2()
        else if (currentStation === 3) resetStation3()
        else if (currentStation === 4) resetStation4()
      }

      // ==============================================================
      // 1. STATION 1 LOGIC (MAKING TEN)
      // ==============================================================
      const block10 = document.getElementById("block10")
      const snapZone10 = document.getElementById("snapZone10")
      let is10Dragging = false,
        is10Locked = false
      let start10X, start10Y

      block10.addEventListener("pointerdown", (e) => {
        if (is10Locked) return
        is10Dragging = true
        block10.setPointerCapture(e.pointerId)
        start10X = e.clientX
        start10Y = e.clientY
        block10.classList.add("elevated")
        playWoodThock(1.1)
      })

      window.addEventListener("pointermove", (e) => {
        if (!is10Dragging || is10Locked) return
        const dx = e.clientX - start10X
        const dy = e.clientY - start10Y
        block10.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`

        const bRect = block10.getBoundingClientRect()
        const zRect = snapZone10.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )
        snapZone10.classList.toggle("hover", dist < 100)
      })

      window.addEventListener("pointerup", () => {
        if (!is10Dragging || is10Locked) return
        is10Dragging = false
        block10.classList.remove("elevated")

        const bRect = block10.getBoundingClientRect()
        const zRect = snapZone10.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )

        if (dist < 100) {
          is10Locked = true
          snapZone10.classList.remove("hover")
          block10.classList.add("locked")
          block10.style.transform = ""
          playWoodThock(0.85)
          document.getElementById("engravedBadge").textContent = EQUATIONS[1].solved
          document.getElementById("engravedBadge").classList.add("solved")
        } else {
          block10.style.transform = "translate(0, 0)"
        }
      })

      function resetStation1() {
        is10Locked = false
        block10.classList.remove("locked")
        block10.style.transform = ""
        document.getElementById("engravedBadge").textContent = EQUATIONS[1].normal
        document.getElementById("engravedBadge").classList.remove("solved")
        playWoodThock(1.2)
      }

      // ==============================================================
      // 2. STATION 2 LOGIC (ARRAYS)
      // ==============================================================
      const arrayDragSlat = document.getElementById("arrayDragSlat")
      const arrayDropZone = document.getElementById("arrayDropZone")
      let isArrayDragging = false,
        isArrayLocked = false
      let startArrayX, startArrayY

      arrayDragSlat.addEventListener("pointerdown", (e) => {
        if (isArrayLocked) return
        isArrayDragging = true
        arrayDragSlat.setPointerCapture(e.pointerId)
        startArrayX = e.clientX
        startArrayY = e.clientY
        arrayDragSlat.classList.add("elevated")
        playWoodThock(1.1)
      })

      window.addEventListener("pointermove", (e) => {
        if (!isArrayDragging || isArrayLocked) return
        const dx = e.clientX - startArrayX
        const dy = e.clientY - startArrayY
        arrayDragSlat.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`

        const bRect = arrayDragSlat.getBoundingClientRect()
        const zRect = arrayDropZone.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )
        arrayDropZone.classList.toggle("hover", dist < 90)
      })

      window.addEventListener("pointerup", () => {
        if (!isArrayDragging || isArrayLocked) return
        isArrayDragging = false
        arrayDragSlat.classList.remove("elevated")

        const bRect = arrayDragSlat.getBoundingClientRect()
        const zRect = arrayDropZone.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )

        if (dist < 90) {
          isArrayLocked = true
          arrayDropZone.classList.remove("hover")
          arrayDragSlat.classList.add("locked")
          arrayDragSlat.style.transform = ""
          playSequentialThocks()
          document.getElementById("engravedBadge").textContent = EQUATIONS[2].solved
          document.getElementById("engravedBadge").classList.add("solved")
        } else {
          arrayDragSlat.style.transform = "translate(0, 0)"
        }
      })

      function resetStation2() {
        isArrayLocked = false
        arrayDragSlat.classList.remove("locked")
        arrayDragSlat.style.transform = ""
        document.getElementById("engravedBadge").textContent = EQUATIONS[2].normal
        document.getElementById("engravedBadge").classList.remove("solved")
        playWoodThock(1.2)
      }

      // ==============================================================
      // 3. STATION 3 LOGIC (ODD & EVEN PARITY)
      // ==============================================================
      const parityPeg = document.getElementById("parityPeg")
      const parityDropSocket = document.getElementById("parityDropSocket")
      let isParityDragging = false,
        isParityLocked = false
      let startParityX, startParityY

      parityPeg.addEventListener("pointerdown", (e) => {
        if (isParityLocked) return
        isParityDragging = true
        parityPeg.setPointerCapture(e.pointerId)
        startParityX = e.clientX
        startParityY = e.clientY
        parityPeg.classList.add("elevated")
        playWoodThock(1.1)
      })

      window.addEventListener("pointermove", (e) => {
        if (!isParityDragging || isParityLocked) return
        const dx = e.clientX - startParityX
        const dy = e.clientY - startParityY
        parityPeg.style.transform = `translate(${dx}px, ${dy}px) scale(1.18)`

        const bRect = parityPeg.getBoundingClientRect()
        const zRect = parityDropSocket.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )
        parityDropSocket.classList.toggle("hover", dist < 80)
      })

      window.addEventListener("pointerup", () => {
        if (!isParityDragging || isParityLocked) return
        isParityDragging = false
        parityPeg.classList.remove("elevated")

        const bRect = parityPeg.getBoundingClientRect()
        const zRect = parityDropSocket.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )

        if (dist < 80) {
          isParityLocked = true
          parityDropSocket.classList.remove("hover")
          parityPeg.classList.add("locked")
          parityPeg.style.transform = ""
          parityDropSocket.appendChild(parityPeg)
          playWoodThock(0.9)
          document.getElementById("engravedBadge").textContent = EQUATIONS[3].solved
          document.getElementById("engravedBadge").classList.add("solved")
        } else {
          parityPeg.style.transform = "translate(0, 0)"
        }
      })

      function resetStation3() {
        isParityLocked = false
        parityPeg.classList.remove("locked")
        parityPeg.style.transform = ""
        document.getElementById("station-3").appendChild(parityPeg)
        document.getElementById("engravedBadge").textContent = EQUATIONS[3].normal
        document.getElementById("engravedBadge").classList.remove("solved")
        playWoodThock(1.2)
      }

      // ==============================================================
      // 4. STATION 4 LOGIC (GEOMETRY EQUAL SHARES)
      // ==============================================================
      const geoWedge = document.getElementById("geoWedge")
      const geoSnapZone = document.getElementById("geoSnapZone")
      let isGeoDragging = false,
        isGeoLocked = false
      let startGeoX, startGeoY

      geoWedge.addEventListener("pointerdown", (e) => {
        if (isGeoLocked) return
        isGeoDragging = true
        geoWedge.setPointerCapture(e.pointerId)
        startGeoX = e.clientX
        startGeoY = e.clientY
        geoWedge.classList.add("elevated")
        playWoodThock(1.1)
      })

      window.addEventListener("pointermove", (e) => {
        if (!isGeoDragging || isGeoLocked) return
        const dx = e.clientX - startGeoX
        const dy = e.clientY - startGeoY
        geoWedge.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`

        const bRect = geoWedge.getBoundingClientRect()
        const zRect = geoSnapZone.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )
        geoSnapZone.classList.toggle("hover", dist < 90)
      })

      window.addEventListener("pointerup", () => {
        if (!isGeoDragging || isGeoLocked) return
        isGeoDragging = false
        geoWedge.classList.remove("elevated")

        const bRect = geoWedge.getBoundingClientRect()
        const zRect = geoSnapZone.getBoundingClientRect()
        const dist = Math.hypot(
          bRect.left + bRect.width / 2 - (zRect.left + zRect.width / 2),
          bRect.top + bRect.height / 2 - (zRect.top + zRect.height / 2),
        )

        if (dist < 90) {
          isGeoLocked = true
          geoSnapZone.classList.remove("hover")
          geoWedge.classList.add("locked")
          geoWedge.style.transform = ""
          geoSnapZone.setAttribute("fill", "url(#mintGrad)")
          geoSnapZone.setAttribute("stroke-dasharray", "none")
          geoWedge.style.display = "none"
          playWoodThock(0.8)
          document.getElementById("engravedBadge").textContent = EQUATIONS[4].solved
          document.getElementById("engravedBadge").classList.add("solved")
        } else {
          geoWedge.style.transform = "translate(0, 0)"
        }
      })

      function resetStation4() {
        isGeoLocked = false
        geoWedge.classList.remove("locked")
        geoWedge.style.transform = ""
        geoWedge.style.display = "block"
        geoSnapZone.setAttribute("fill", "rgba(46, 213, 115, 0.12)")
        geoSnapZone.setAttribute("stroke-dasharray", "6 5")
        document.getElementById("engravedBadge").textContent = EQUATIONS[4].normal
        document.getElementById("engravedBadge").classList.remove("solved")
        playWoodThock(1.2)
      }
    </script>
  </body>
</html>
